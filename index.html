<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoring Kinerja Pelayanan Gangguan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2745; --navy2:#123a63; --ink:#101828; --paper:#f4f6f9;
  --line:#dbe2ea; --muted:#5b6b7f; --card:#ffffff;
  --header-grad1:#ffffff; --header-grad2:#eef2f7;
  --header-text:#101828; --header-sub-text:#5b6b7f; --header-line:#dbe2ea;
  --header-chip-bg:#eef2f7; --header-chip-border:#dbe2ea; --header-chip-hover:#e3e9f0;
  --header-shadow:rgba(15,23,42,.14);
  --sidebar-bg:#0b2745; --sidebar-bg2:#123a63; --sidebar-text:#dbe6f2; --sidebar-active:#e8a33d;
  --sidebar-item-hover:rgba(255,255,255,.08); --sidebar-item-active-bg:rgba(255,255,255,.12); --sidebar-item-active-text:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0b1e33; --navy2:#123a63; --ink:#e8edf3; --paper:#0d1620;
    --line:#233246; --muted:#8fa0b3; --card:#101c29;
    --header-grad1:#050b12; --header-grad2:#0d1f33;
    --header-text:#e8edf3; --header-sub-text:#9fb4c8; --header-line:rgba(255,255,255,.08);
    --header-chip-bg:rgba(255,255,255,.12); --header-chip-border:rgba(255,255,255,.18); --header-chip-hover:rgba(255,255,255,.22);
    --header-shadow:rgba(0,0,0,.35);
    --sidebar-bg:#eef2f7; --sidebar-bg2:#dbe2ea; --sidebar-text:#123a63; --sidebar-active:#c96f16;
    --sidebar-item-hover:rgba(11,39,69,.06); --sidebar-item-active-bg:rgba(11,39,69,.10); --sidebar-item-active-text:#0b2745;
  }
}
:root[data-theme="dark"]{
  --navy:#0b1e33; --navy2:#123a63; --ink:#e8edf3; --paper:#0d1620;
  --line:#233246; --muted:#8fa0b3; --card:#101c29;
  --header-grad1:#050b12; --header-grad2:#0d1f33;
  --header-text:#e8edf3; --header-sub-text:#9fb4c8; --header-line:rgba(255,255,255,.08);
  --header-chip-bg:rgba(255,255,255,.12); --header-chip-border:rgba(255,255,255,.18); --header-chip-hover:rgba(255,255,255,.22);
  --header-shadow:rgba(0,0,0,.35);
  --sidebar-bg:#eef2f7; --sidebar-bg2:#dbe2ea; --sidebar-text:#123a63; --sidebar-active:#c96f16;
  --sidebar-item-hover:rgba(11,39,69,.06); --sidebar-item-active-bg:rgba(11,39,69,.10); --sidebar-item-active-text:#0b2745;
}
:root[data-theme="light"]{
  --header-grad1:#ffffff; --header-grad2:#eef2f7;
  --header-text:#101828; --header-sub-text:#5b6b7f; --header-line:#dbe2ea;
  --header-chip-bg:#eef2f7; --header-chip-border:#dbe2ea; --header-chip-hover:#e3e9f0;
  --header-shadow:rgba(15,23,42,.14);
  --sidebar-bg:#0b2745; --sidebar-bg2:#123a63; --sidebar-text:#dbe6f2; --sidebar-active:#e8a33d;
  --sidebar-item-hover:rgba(255,255,255,.08); --sidebar-item-active-bg:rgba(255,255,255,.12); --sidebar-item-active-text:#ffffff;
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}

header.top{
  background:linear-gradient(135deg,var(--header-grad1),var(--header-grad2));color:var(--header-text);
  padding:calc(22px + env(safe-area-inset-top,0px)) 22px 18px;
  position:sticky; top:0; z-index:80;
  border-bottom:1px solid var(--header-line);
  transition:padding .35s cubic-bezier(.4,0,.2,1), box-shadow .35s ease, background .3s ease, border-color .3s ease;
  box-shadow:0 0 0 rgba(0,0,0,0);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
header.top.is-compact{ padding:calc(9px + env(safe-area-inset-top,0px)) 18px 9px; box-shadow:0 4px 16px var(--header-shadow); }

.header-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;flex:1;min-width:0}
.header-text{flex:1;min-width:220px;min-height:0}
.org-line{
  margin:0 0 4px; font-size:1.12rem; font-weight:800; letter-spacing:.01em;
  color:var(--header-text); opacity:1; line-height:1.25;
  transition:max-height .35s cubic-bezier(.4,0,.2,1), opacity .25s ease, margin .25s ease, font-size .35s ease;
  max-height:64px; overflow:hidden;
}
header.top.is-compact .org-line{max-height:0; opacity:0; margin:0}
header.top h1{
  margin:0;font-size:.94rem;font-weight:600;letter-spacing:.01em;
  color:var(--header-sub-text);
  transition:font-size .35s ease, opacity .3s ease;
}
header.top.is-compact h1{font-size:.88rem;font-weight:700;color:var(--header-text)}
header.top p.header-sub{
  margin:8px 0 0;font-size:.78rem;color:var(--header-sub-text);opacity:.85;font-weight:400;
  transition:max-height .35s cubic-bezier(.4,0,.2,1), opacity .25s ease, margin .25s ease;
  max-height:40px; overflow:hidden;
}
header.top.is-compact p.header-sub{max-height:0; opacity:0; margin:0}

.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.header-right-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.brand-logo{height:46px;width:auto;display:block;transition:height .35s cubic-bezier(.4,0,.2,1)}
header.top.is-compact .brand-logo{height:26px}
.header-logo-png{height:56px;width:auto;display:block;flex:none;transition:height .35s cubic-bezier(.4,0,.2,1)}
header.top.is-compact .header-logo-png{height:30px}
.theme-toggle-btn{
  display:flex;align-items:center;gap:6px;background:var(--header-chip-bg);
  border:1px solid var(--header-chip-border);color:var(--header-text);padding:6px 11px;border-radius:20px;
  font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s ease;
}
.theme-toggle-btn:hover{background:var(--header-chip-hover)}
.theme-icon{font-size:.85rem;line-height:1}
.update-pin{
  font-size:.7rem;color:var(--header-sub-text);opacity:.9;white-space:nowrap;
  background:var(--header-chip-bg);border:1px solid var(--header-chip-border);padding:3px 9px;border-radius:14px;
}

.app-shell{display:flex;flex:1;min-height:0}

.sidebar{
  width:230px; flex:none; background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg2));
  color:var(--sidebar-text); transition:width .28s cubic-bezier(.4,0,.2,1); overflow:hidden;
  display:flex; flex-direction:column; padding:14px 0;
}
.sidebar.collapsed{width:64px}
.sidebar-item{
  display:flex; align-items:center; gap:12px; padding:12px 18px; cursor:pointer;
  font-size:.88rem; font-weight:600; white-space:nowrap; color:var(--sidebar-text);
  border-left:3px solid transparent; transition:background .2s ease, border-color .2s ease;
}
.sidebar-item:hover{background:var(--sidebar-item-hover)}
.sidebar-item.active{background:var(--sidebar-item-active-bg); border-left-color:var(--sidebar-active); color:var(--sidebar-item-active-text)}
.sidebar-icon{font-size:1.15rem; flex:none; width:22px; text-align:center}
.sidebar.collapsed .sidebar-label{display:none}
.sidebar-item .sidebar-label{overflow:hidden;text-overflow:ellipsis}

.sidebar-edge-toggle{
  position:fixed; top:50%; left:230px; transform:translate(-50%,-50%);
  width:30px; height:30px; border-radius:50%; flex:none;
  background:var(--card); border:1px solid var(--line); color:var(--ink);
  font-size:.8rem; cursor:pointer; z-index:95;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 10px rgba(15,23,42,.2);
  transition:left .28s cubic-bezier(.4,0,.2,1), background .2s ease;
}
.sidebar-edge-toggle:hover{background:var(--header-chip-hover)}
.sidebar-edge-toggle.collapsed{left:64px}
@media (max-width:760px){
  .sidebar-edge-toggle.collapsed{left:0}
}

.content-area{flex:1; min-width:0; position:relative; background:var(--paper)}
.view{display:none; width:100%; height:100%}
.view.active{display:block}
#homeView.active{display:flex}
#homeView{
  align-items:center; justify-content:center; flex-direction:column; gap:18px;
  min-height:calc(100vh - 96px); text-align:center; padding:20px;
}
.home-logo-png{width:clamp(140px,18vw,240px); height:auto}
.home-logo{width:clamp(240px,36vw,460px); height:auto}
.home-title{
  color:var(--ink); font-family:'Poppins','Segoe UI',Arial,sans-serif;
  font-size:1.9rem; font-weight:800; letter-spacing:.03em;
}

.panel-frame{width:100%; height:calc(100vh - 96px); border:none; display:block; background:var(--card)}
header.top.is-compact ~ .app-shell .panel-frame{height:calc(100vh - 61px)}

@media (max-width:760px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:90; height:100%; padding-top:calc(90px + env(safe-area-inset-top,0px))}
  .sidebar:not(.collapsed){box-shadow:6px 0 24px rgba(0,0,0,.25)}
  .sidebar.collapsed{width:0}
  .org-line{font-size:1rem}
}
</style>
</head>
<body>
<header class="top" id="topHeader">
  <img id="headerLogoPng" class="header-logo-png" alt="Logo PLN Nusa Daya">
  <div class="header-row">
    <div class="header-text">
      <div class="org-line">PLN NUSA DAYA UL. MANADO, TAHUNA &amp; KOTAMOBAGU.</div>
      <h1>Monitoring Kinerja Pelayanan Gangguan</h1>
      <p class="header-sub">Sumber Data : APKT - EIS - VCC</p>
    </div>
    <div class="header-right">
      <div class="header-right-top">
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Ganti tema terang/gelap">
          <span class="theme-icon" id="themeIcon">🌙</span><span id="themeLabel">Gelap</span>
        </button>
        <img id="brandLogo" class="brand-logo" alt="Logo PLN Nusa Daya">
      </div>
      <div class="update-pin">Dimuat: <span id="asOf"></span></div>
    </div>
  </div>
</header>

<div class="app-shell">
  <button type="button" class="sidebar-edge-toggle" id="sidebarToggle" aria-label="Tampilkan/sembunyikan menu"><span id="menuIcon">◀</span></button>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-item active" data-target="home" title="Beranda">
      <span class="sidebar-icon">🏠</span><span class="sidebar-label">Beranda</span>
    </div>
    <div class="sidebar-item" data-target="analisis" title="Analisis Kinerja">
      <span class="sidebar-icon">📊</span><span class="sidebar-label">Analisis Kinerja</span>
    </div>
    <div class="sidebar-item" data-target="detail" title="Detail Kinerja">
      <span class="sidebar-icon">📋</span><span class="sidebar-label">Detail Kinerja</span>
    </div>
  </nav>

  <main class="content-area">
    <div id="homeView" class="view active">
      <img id="homeLogoPng" class="home-logo-png" alt="Logo PLN Nusa Daya">
      <img id="homeLogo" class="home-logo" alt="Logo PLN Nusa Daya">
      <div class="home-title">Selamat Datang</div>
    </div>
    <div id="analisisView" class="view"><iframe id="ifrAnalisis" class="panel-frame" title="Monitoring Performa YO"></iframe></div>
    <div id="detailView" class="view"><iframe id="ifrDetail" class="panel-frame" title="Detail Kinerja Petugas Yantek"></iframe></div>
  </main>
</div>

function b64ToUtf8(b64){
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

/* ===== Theme ===== */
const THEME_KEY = 'ndShellTheme';
function effectiveTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if(attr) return attr;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function broadcastTheme(theme){
  [document.getElementById('ifrAnalisis'), document.getElementById('ifrDetail')].forEach(f=>{
    try{ if(f && f.contentWindow) f.contentWindow.postMessage({type:'nd-theme', theme:theme}, '*'); }catch(e){}
  });
}
function applyThemeUI(theme){
  const logo = document.getElementById('brandLogo');
  const homeLogo = document.getElementById('homeLogo');
  const headerPng = document.getElementById('headerLogoPng');
  const homePng = document.getElementById('homeLogoPng');
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  const src = theme === 'dark' ? LOGO_WHITE : LOGO_COLOUR;
  const pngSrc = theme === 'dark' ? PNG_LOGO_PUTIH : PNG_LOGO_BIRU;
  if(logo) logo.src = src;
  if(homeLogo) homeLogo.src = src;
  if(headerPng) headerPng.src = pngSrc;
  if(homePng) homePng.src = pngSrc;
  if(icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
  if(label) label.textContent = theme === 'dark' ? 'Terang' : 'Gelap';
}
function setTheme(theme, persist){
  document.documentElement.setAttribute('data-theme', theme);
  applyThemeUI(theme);
  broadcastTheme(theme);
  if(persist){ try{ localStorage.setItem(THEME_KEY, theme); }catch(e){} }
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(saved === 'light' || saved === 'dark'){ setTheme(saved, false); }
  else { applyThemeUI(effectiveTheme()); }
})();
document.getElementById('themeToggleBtn').addEventListener('click', ()=>{
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  setTheme(next, true);
});
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onSystemChange = ()=>{ if(!document.documentElement.getAttribute('data-theme')) { applyThemeUI(effectiveTheme()); broadcastTheme(effectiveTheme()); } };
  if(mq.addEventListener) mq.addEventListener('change', onSystemChange);
  else if(mq.addListener) mq.addListener(onSystemChange);
}

/* ===== Header scroll animation (sync dengan scroll shell & scroll di dalam panel) ===== */
(function initHeaderScroll(){
  const header = document.getElementById('topHeader');
  let ticking = false;
  function update(y){
    const compact = y > 24;
    header.classList.toggle('is-compact', compact);
    ticking = false;
  }
  window.addEventListener('scroll', ()=>{
    if(!ticking){ window.requestAnimationFrame(()=>update(window.scrollY)); ticking = true; }
  }, {passive:true});
  window.addEventListener('message', (ev)=>{
    const d = ev && ev.data;
    if(d && d.type === 'nd-scroll'){
      if(!ticking){ window.requestAnimationFrame(()=>update(d.y)); ticking = true; }
    }
  });
  update(0);
})();

/* ===== Sidebar toggle ===== */
const sidebar = document.getElementById('sidebar');
const menuIcon = document.getElementById('menuIcon');
const sidebarEdgeBtn = document.getElementById('sidebarToggle');
function updateMenuIcon(){
  const collapsed = sidebar.classList.contains('collapsed');
  if(menuIcon) menuIcon.textContent = collapsed ? '▶' : '◀';
  if(sidebarEdgeBtn) sidebarEdgeBtn.classList.toggle('collapsed', collapsed);
}
sidebarEdgeBtn.addEventListener('click', ()=>{
  sidebar.classList.toggle('collapsed');
  updateMenuIcon();
});
updateMenuIcon();

/* ===== Menu switching ===== */
const views = { home: document.getElementById('homeView'), analisis: document.getElementById('analisisView'), detail: document.getElementById('detailView') };
document.querySelectorAll('.sidebar-item').forEach(item=>{
  item.addEventListener('click', ()=>{
    document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    const target = item.getAttribute('data-target');
    Object.keys(views).forEach(k=> views[k].classList.toggle('active', k===target));
    if(window.innerWidth <= 760){ sidebar.classList.add('collapsed'); updateMenuIcon(); }
  });
});

/* ===== Load embedded panels (lazy on first paint, sync ready immediately) ===== */
const ifrAnalisis = document.getElementById('ifrAnalisis');
const ifrDetail = document.getElementById('ifrDetail');
ifrAnalisis.addEventListener('load', ()=>{ setTimeout(()=>broadcastTheme(effectiveTheme()), 60); });
ifrDetail.addEventListener('load', ()=>{ setTimeout(()=>broadcastTheme(effectiveTheme()), 60); });
ifrAnalisis.srcdoc = b64ToUtf8(ANALISIS_B64);
ifrDetail.srcdoc = b64ToUtf8(DETAIL_B64);

document.getElementById('asOf').textContent = new Date().toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'});
</script>
